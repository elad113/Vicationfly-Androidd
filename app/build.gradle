plugins { id 'com.android.application' }
android {
    namespace 'com.vicationfly.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vicationfly.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.2'
        buildConfigField "String", "FLIGHT_BACKEND_URL", '""'
        buildConfigField "String", "STRIPE_PUBLISHABLE_KEY", '""'
        buildConfigField "String", "PAYPAL_CLIENT_ID", '""'
    }
    buildFeatures { buildConfig true }
}
